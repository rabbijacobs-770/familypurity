<head>

<meta name="description" content="Search every chapter of Family Purity by Rabbi Fishel Jacobs, including the sources, to find what the book says about any topic.">
<link rel="canonical" href="https://www.familypurity.com/search.html">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="assets/site.css">
<style>
.search-hero .wrap{grid-template-columns:1fr;padding-block:clamp(7rem,12vw,8.5rem) clamp(2.2rem,5vw,3rem);display:grid;gap:1rem}
.search-hero h1{color:#fff;font:500 clamp(2.3rem,5vw,3.4rem)/1.08 var(--display)}
.search-box{display:flex;gap:.5rem;max-width:40rem;width:100%}
.search-box input{flex:1;min-width:0;font:inherit;font-size:1.2rem;padding:.85rem 1.1rem;border-radius:999px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.95);color:#221d33}
.hint-line{color:#e6e0fa;font-size:1rem}
.results{display:grid;gap:1.6rem;padding-block:2.5rem 1rem}
.res-count{color:var(--muted)}
.res-group{display:grid;gap:.6rem}
.res-group h2{font-size:1.5rem}
.res-group h2 a{color:inherit;text-decoration:none}
.res-group h2 small{display:block;font:600 .95rem var(--display);font-variant-caps:small-caps;letter-spacing:.06em;color:var(--gold);margin-bottom:.2rem}
.hit{display:block;padding:.9rem 1.1rem;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-decoration:none;line-height:1.5}
.hit:hover{border-color:var(--violet)}
.hit .kind{display:inline-block;font-size:.85rem;font-weight:600;color:var(--muted);margin-right:.4rem}
.hit mark{background:var(--gold-light);color:#221d33;border-radius:3px;padding:0 .1em}
.empty{color:var(--muted);padding:1rem 0}
</style>
</head>
<body>

<header class="top">
  <div class="pill on-flowers">
    <a class="brand" href="index.html" aria-label="Family Purity, home"><img src="images/brand/fp-wordmark.svg" alt="Family Purity" width="454" height="118"></a>
    <nav class="links" id="links" aria-label="Main">
      <a href="index.html#books">Books</a>
      <a href="index.html#resources">Free resources</a>
      <a href="calendar.html">Calendar</a>
      <a href="search.html" aria-current="page">Search</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
    </nav>
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="links">Menu</button>
    <a class="btn" href="https://wa.me/972587921788" target="_blank" rel="noopener">Ask a question</a>
  </div>
</header>

<main>
  <section class="hero search-hero panel on-flowers" style="padding-block:0">
    <div class="wrap">
      <p class="eyebrow">Search</p>
      <h1>Search the chapters</h1>
      <form class="search-box" id="sform" role="search">
        <label for="q" class="visually-hidden" style="position:absolute;left:-9999px">Search for</label>
        <input id="q" name="q" type="search" placeholder="For example: stain, mikveh, five days" autocomplete="off">
        <button class="btn btn-solid" type="submit">Search</button>
      </form>
      <p class="hint-line">Searches every chapter online, including the sources.</p>
    </div>
  </section>
  <div class="wrap">
    <section class="results" id="results" aria-live="polite"></section>
  </div>
</main>

<footer class="panel on-flowers" style="margin-top:3rem">
  <div class="wrap">
    <div>
      <a class="brand" href="index.html" aria-label="Family Purity, home"><img src="images/brand/fp-wordmark.svg" alt="Family Purity" width="454" height="118"></a>
      <p>Rabbi Fishel Jacobs</p>
    </div>
    <ul>
      <li><a href="index.html#books">Books</a></li>
      <li><a href="index.html#resources">Free resources</a></li>

    </ul>
    <small>&copy; Family Purity <span class="credit">Photo: Hisu Lee / Unsplash</span></small>
  </div>
</footer>

<script>
const menuBtn=document.querySelector('.menu-btn'), links=document.getElementById('links');
menuBtn.addEventListener('click',()=>{const open=links.classList.toggle('open');menuBtn.setAttribute('aria-expanded',open);menuBtn.textContent=open?'Close':'Menu'});

const fold=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’‘]/g,"'").replace(/[“”]/g,'"').toLowerCase();
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let INDEX=null;
const out=document.getElementById('results'), input=document.getElementById('q');

function snippet(text,terms){
  const f=fold(text); let at=f.indexOf(terms[0]); if(at<0) at=0;
  const start=Math.max(0,at-90), end=Math.min(text.length,at+170);
  let s=(start?'… ':'')+text.slice(start,end)+(end<text.length?' …':'');
  let h=esc(s);
  for(const t of terms){
    if(!t) continue;
    const re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    h=h.replace(re,'<mark>$1</mark>');
  }
  return h;
}
function run(q){
  q=q.trim(); history.replaceState(null,'',q?'?q='+encodeURIComponent(q):location.pathname);
  if(!q){out.innerHTML='';return;}
  if(!INDEX){out.innerHTML='<p class="res-count">Loading…</p>';return;}
  const terms=fold(q).split(/\s+/).filter(Boolean);
  let total=0, html='';
  for(const ch of INDEX){
    const hits=[];
    const test=t=>terms.every(w=>fold(t).includes(w));
    ch.heads.forEach(t=>{if(test(t))hits.push(['Heading',t]);});
    ch.paras.forEach(t=>{if(test(t))hits.push(['',t]);});
    ch.notes.forEach(t=>{if(test(t))hits.push(['Source',t]);});
    if(!hits.length) continue;
    total+=hits.length;
    const href='read/'+ch.slug+'.html?q='+encodeURIComponent(q);
    html+=`<div class="res-group"><h2><a href="${href}"><small>${esc(ch.num)}</small>${esc(ch.title)}</a></h2>`+
      hits.slice(0,8).map(([k,t])=>`<a class="hit" href="${href}">${k?`<span class="kind">${k}</span>`:''}${snippet(t,terms)}</a>`).join('')+
      (hits.length>8?`<a class="res-count" href="${href}">${hits.length-8} more in this chapter &rarr;</a>`:'')+'</div>';
  }
  out.innerHTML=total?`<p class="res-count">${total} ${total===1?'passage':'passages'} found for &ldquo;${esc(q)}&rdquo;</p>`+html
    :`<p class="empty">Nothing found for &ldquo;${esc(q)}&rdquo;. Try a shorter word, or <a href="https://wa.me/972587921788" target="_blank" rel="noopener">ask Rabbi Jacobs</a>.</p>`;
}
let timer;
input.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>run(input.value),250);});
document.getElementById('sform').addEventListener('submit',e=>{e.preventDefault();run(input.value);});
const q0=new URLSearchParams(location.search).get('q'); if(q0) input.value=q0;
fetch('assets/search-index.json').then(r=>r.json()).then(d=>{INDEX=d;run(input.value);}).catch(()=>{out.innerHTML='<p class="empty">Search could not load. Please refresh the page.</p>';});
</script>

</body>
</html>
